<style>
:root { color-scheme: dark; --ink: #0d0d0f; --paper: #f5f3ef; --muted: #a9a6a0; --emerald: #50c878; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper);
       font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand img { width: 44px; height: 44px; border-radius: 10px; }
.brand span { font: 800 18px/1 ui-serif, Georgia, serif; letter-spacing: .3em; color: var(--emerald); }
.art { width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; border-radius: 14px; display: block;
       border: 1px solid rgba(255,255,255,.12); }
.kicker { margin: 24px 0 6px; font: 700 13px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .2em; color: var(--muted); }
h1 { margin: 0 0 12px; font: 800 30px/1.15 ui-serif, Georgia, serif; }
.score { margin: 0 0 28px; color: var(--muted); }
.score b { color: var(--emerald); }
.button { display: block; text-align: center; text-decoration: none; font-weight: 700; padding: 16px; border-radius: 14px; margin-bottom: 12px; }
.primary { background: var(--emerald); color: var(--ink); }
.secondary { border: 1px solid rgba(255,255,255,.25); color: var(--paper); }
.fine { margin-top: 24px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/img/icon.png" alt=""><span>CLUEBOUND</span></div>
  <img class="art" id="art" src="https://cluebound.github.io/c/og/default.jpg" alt="">
  <p class="kicker" id="kicker">A FRIEND'S CHALLENGE</p>
  <h1 id="headline">A friend sent you this case. Can you catch the killer?</h1>
  <p class="score" id="score">Question the suspects, catch the lie, name the killer.</p>
  <a class="button primary" href="https://apps.apple.com/us/app/cluebound-ai-murder-mystery/id6761445077">Get Cluebound on the App Store</a>
  <a class="button secondary" id="open" href="cluebound://">I have Cluebound: take the challenge</a>
  <p class="fine">A murder mystery you solve by questioning the suspects. Free to play.</p>
</main>
<script>
(function () {
  var titles = {1:"The Gala Poisoning",2:"Missing on the 14th Floor",6:"The Hours Between",10:"The Final Broadcast",11:"The Missing Manuscript",14:"'Til Death Do Us Part"}, withArt = [1,2,6,10,11,14];
  var p = new URLSearchParams(location.search);
  var m = location.pathname.match(/\/c\/(\d+)/);
  var n = parseInt(m ? m[1] : p.get("case"), 10);
  // Whole numbers only, as the app reads them (Int("7x") is no score there either).
  function whole(v) { return /^\d+$/.test(v || "") ? parseInt(v, 10) : NaN; }
  var q = whole(p.get("q")), s = whole(p.get("s")), unsolved = p.get("u") === "1";
  var hasCase = n >= 1 && n <= 999, hasScore = q >= 0 && q <= 99;
  // The sender's first name (n=), cleaned like the app's Challenge.cleanName; else "A friend".
  var rawName = (p.get("n") || "").trim();
  var name = rawName.length <= 20 && /^[\p{L} '\u2019-]+$/u.test(rawName) && /\p{L}/u.test(rawName) ? rawName : "";
  function el(id) { return document.getElementById(id); }
  if (hasCase) {
    el("kicker").textContent = "CASE " + (n < 10 ? "0" + n : n);
    if (titles[n]) el("score").textContent = titles[n];
    if (withArt.indexOf(n) >= 0) el("art").src = "/c/og/" + n + ".jpg";
  }
  if (hasCase && !hasScore) {
    // "Play this with a friend": no score, just the case.
    el("headline").textContent = (name || "A friend") + " wants you to try this case.";
    el("open").textContent = "I have Cluebound: open the case";
  }
  if (hasScore) {
    var stars = unsolved ? "" : " " + "\u2605\u2605\u2605".slice(0, Math.max(0, Math.min(3, s || 0)));
    el("headline").textContent = unsolved
      ? "This case fooled your friend. Can you crack it?"
      : "Your friend caught the killer in " + q + (q === 1 ? " question" : " questions") + ". Can you beat them?";
    var line = unsolved ? "Your friend: unsolved" : "Your friend: " + q + (q === 1 ? " question" : " questions") + stars;
    el("score").textContent = (titles[n] ? titles[n] + " \u00b7 " : "") + line;
  }
  // Same challenge, through the app's own scheme (a universal link tapped on its own site stays in Safari).
  if (hasCase) {
    var query = hasScore ? "q=" + q + "&s=" + (unsolved ? 0 : (s || 0)) + (unsolved ? "&u=1" : "") : "";
    if (name) query += (query ? "&" : "") + "n=" + encodeURIComponent(name);
    el("open").href = "cluebound://challenge/" + n + (query ? "?" + query : "");
  }
})();
</script>
</body>
</html>
